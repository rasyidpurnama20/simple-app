# OBE System - development stack.
# Start everything with:  docker compose up -d --build
# Then open:              http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: obe_system
      POSTGRES_USER: obe
      POSTGRES_PASSWORD: obe_password
    volumes:
      - obe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obe -d obe_system"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: obe_system
      POSTGRES_USER: obe
      POSTGRES_PASSWORD: obe_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  obe_pgdata:
